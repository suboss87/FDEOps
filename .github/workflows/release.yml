name: Publish to npm

# A release is a tag, so the published bytes are always a commit you can point
# at. The tag must match the version in package.json - a mismatch fails before
# anything reaches the registry.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must match package.json, e.g. 3.11.0)"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: npm supports trusted publishing
        run: |
          v=$(npm --version)
          echo "npm $v"
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$v" \
            || { echo "refusing: trusted publishing needs npm >= 11.5.1"; exit 1; }

      - name: The tag and package.json agree
        run: |
          pkg=$(node -p "require('./package.json').version")
          want="${GITHUB_REF_NAME#v}"
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && want="${{ inputs.version }}"
          echo "package.json=$pkg requested=$want"
          [ "$pkg" = "$want" ] || { echo "refusing: version mismatch"; exit 1; }

      - name: Gates and tests
        run: npm run check

      - name: This version is not already on the registry
        run: |
          pkg=$(node -p "require('./package.json').version")
          if npm view "fdeops@$pkg" version >/dev/null 2>&1; then
            echo "refusing: fdeops@$pkg is already published"; exit 1
          fi

      # Authenticates through npm trusted publishing: the package's trusted publisher on
      # npmjs.com must name this repository and release.yml. No long-lived token is used.
      - name: Publish
        run: npm publish --provenance --access public

      - name: Confirm the registry serves it
        timeout-minutes: 12
        run: node .github/scripts/verify-release.cjs
